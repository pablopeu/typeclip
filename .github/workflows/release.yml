# Release automático de TypeClip: al pushear un tag v*, audita y empaqueta,
# y adjunta el ZIP al release de GitHub. El envío a la Chrome Web Store sigue
# siendo manual (ver store/SUBMISSION_CHECKLIST.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (playwright + pillow)
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow

      - name: Auditoría estática (permisos, red, CSP, logging)
        run: python tools/audit.py

      - name: Suite E2E (Chromium headless con la extensión cargada)
        run: |
          playwright install chromium --with-deps
          python tools/e2e.py

      - name: Paquete CWS (validaciones + SHA-256)
        run: python tools/package.py

      - name: Adjuntar ZIP al release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/typeclip-*.zip
